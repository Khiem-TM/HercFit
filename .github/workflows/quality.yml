# Cổng chất lượng của HercFit: lint + import + unit, test tích hợp trên Postgres, eval tất định, frontend.
# Mọi job chạy không gọi dịch vụ tốn phí (model kịch bản, backend giả, Langfuse tắt).
# Chạy cục bộ cùng các bước: make -C tests check PY=/abs/path/python
name: quality

on:
  pull_request:
  push:
    branches: [main, kltn/stabilize]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  LANGFUSE_TRACING: "false"
  JEV_MODE: "off"
  GIT_COMMIT_SHA: ${{ github.sha }}
  # Khoá ký chỉ dùng trong CI; không bao giờ là secret đã triển khai.
  JWT_SECRET_KEY: hercfit-ci-test-only-signing-key-0000000000

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            tests/requirements-dev.txt
      - name: Install
        run: pip install -r tests/requirements-dev.txt ruff==0.17.4
      - name: Lint (pinned ruff, whole backend)
        working-directory: backend
        run: ruff check . --config agentic/ruff.toml
      - name: Import check
        working-directory: backend
        # Chỉ đặt ở bước này: biến MODE toàn workflow sẽ đè biến Make $(MODE) (chế độ eval) của tests/Makefile.
        env:
          MODE: dev
        run: python -c "import agentic.core.app.main, app, worker; print('imports ok')"
      - name: Unit tests
        working-directory: tests
        run: python -m pytest unit

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: hercfit
          POSTGRES_PASSWORD: hercfit-ci-only
          POSTGRES_DB: hercfit_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hercfit -d hercfit_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: hercfit
      POSTGRES_PASSWORD: hercfit-ci-only
      HERCFIT_TEST_DB: hercfit_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            tests/requirements-dev.txt
            tests/requirements-eval.txt
      - name: Install
        run: pip install -r tests/requirements-dev.txt -r tests/requirements-eval.txt
      - name: Integration tests (alembic upgrade head on hercfit_test)
        working-directory: tests
        run: python -m pytest integration

  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            tests/requirements-dev.txt
            tests/requirements-eval.txt
      - name: Install
        run: pip install -r tests/requirements-dev.txt -r tests/requirements-eval.txt
      - name: Deterministic agent eval
        run: make -C tests eval-agent PY=python
      - name: Deterministic safety eval
        run: make -C tests eval-safety PY=python
      - name: Offline Cypher safety
        run: make -C tests cypher-safety PY=python

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npx --no-install vite build
