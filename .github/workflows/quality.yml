# Cổng chất lượng của HercFit: lint + import backend, type-check + build frontend.
# Bộ test và eval (tests/, frontend/tests/) chỉ giữ cục bộ nên CI không chạy chúng. Không gọi dịch vụ tốn phí.
name: quality

on:
  pull_request:
  push:
    branches: [main, kltn/stabilize]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  LANGFUSE_TRACING: "false"
  JEV_MODE: "off"
  GIT_COMMIT_SHA: ${{ github.sha }}
  # Khoá ký chỉ dùng trong CI; không bao giờ là secret đã triển khai.
  JWT_SECRET_KEY: hercfit-ci-test-only-signing-key-0000000000

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r backend/requirements.txt ruff==0.17.4
      - name: Lint (pinned ruff, whole backend)
        working-directory: backend
        run: ruff check . --config agentic/ruff.toml
      - name: Import check
        working-directory: backend
        env:
          MODE: dev
        run: python -c "import agentic.core.app.main, app, worker; print('imports ok')"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npx --no-install vite build
