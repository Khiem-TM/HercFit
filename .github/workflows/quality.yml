# Static checks for HercFit. The evaluation suites live in tests/ outside version control and run locally
# (make -C tests eval-agent ...), so CI checks only what is versioned: lint, imports and frontend types.
name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  LANGFUSE_TRACING: "false"
  GIT_COMMIT_SHA: ${{ github.sha }}

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      # CI-only signing key for the import check; never a deployed secret.
      JWT_SECRET_KEY: hercfit-ci-test-only-signing-key-0000000000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r requirements.txt ruff==0.17.4
      - name: Lint (pinned ruff, agentic application)
        run: ruff check agentic
      - name: Import check
        run: python -c "import agentic.core.app.main, app; print('imports ok')"

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run type-check
