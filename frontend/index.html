<!doctype html>
<html lang="vi" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#131313" />
    <meta
      name="description"
      content="HercFit — trợ lý nhật ký dinh dưỡng và tập luyện tiếng Việt: ghi bữa ăn, buổi tập bằng hội thoại, có xác nhận trước khi lưu."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>HercFit — Trợ lý dinh dưỡng &amp; tập luyện</title>
    <script>
      // Theme before the first paint (src/composables/useTheme.ts keeps it in sync afterwards).
      (function () {
        try {
          var mode = localStorage.getItem("hercfit:theme");
          // Chưa chọn: ứng dụng (/chat) sáng theo thiết kế, trang giới thiệu tối (useTheme.ts).
          if (mode !== "light" && mode !== "dark" && mode !== "system") mode = location.pathname.indexOf("/chat") === 0 ? "light" : "dark";
          var light = mode === "light" || (mode === "system" && matchMedia("(prefers-color-scheme: light)").matches);
          document.documentElement.classList.toggle("light", light);
          document.documentElement.classList.toggle("dark", !light);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
