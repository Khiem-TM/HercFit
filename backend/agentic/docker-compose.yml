name: hercfit-agentic

services:
  agentic:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hercfit-agentic-api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      MODE: ${MODE:-dev}
      AGENT_HOST: 0.0.0.0
      AGENT_PORT: ${AGENT_PORT:-8081}
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-http://host.docker.internal:8080}
      USE_FAKE_MODEL: ${USE_FAKE_MODEL:-true}
      CHECKPOINT_BACKEND: ${CHECKPOINT_BACKEND:-memory}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-hercfit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hercfit_secret}
      POSTGRES_DB: ${POSTGRES_DB:-hercfit_db}
    ports:
      - "${AGENT_PORT:-8081}:8081"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hercfit-agentic-net

  postgres:
    image: pgvector/pgvector:pg16
    container_name: hercfit-agentic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hercfit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hercfit_secret}
      POSTGRES_DB: ${POSTGRES_DB:-hercfit_db}
    ports:
      - "${AGENT_POSTGRES_PORT:-5433}:5432"
    volumes:
      - agentic_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hercfit} -d ${POSTGRES_DB:-hercfit_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hercfit-agentic-net

volumes:
  agentic_pg_data:
    name: hercfit_agentic_pg_data

networks:
  hercfit-agentic-net:
    name: hercfit-agentic-net
    driver: bridge

