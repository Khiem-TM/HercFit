name: hercfit-agentic
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: hercfit
      POSTGRES_PASSWORD: ${AGENT_DB_PASSWORD:-hercfit_secret}
      POSTGRES_DB: hercfit_agentic
    ports: ["${AGENT_POSTGRES_PORT:-5433}:5432"]
    volumes: ["agentic_pg_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hercfit -d hercfit_agentic"]
      interval: 5s
      retries: 10
  migrate:
    build:
      context: ..
      dockerfile: agentic/Dockerfile
    env_file:
      - path: ../.env
        required: false
      - path: .env
        required: false
    environment:
      AGENT_DATABASE_URL: postgresql://hercfit:${AGENT_DB_PASSWORD:-hercfit_secret}@postgres:5432/hercfit_agentic
    command: ["python", "-m", "agentic.scripts.migrate"]
    depends_on:
      postgres:
        condition: service_healthy
  agentic:
    build:
      context: ..
      dockerfile: agentic/Dockerfile
    env_file:
      - path: ../.env
        required: false
      - path: .env
        required: false
    environment:
      AGENT_DATABASE_URL: postgresql://hercfit:${AGENT_DB_PASSWORD:-hercfit_secret}@postgres:5432/hercfit_agentic
      BACKEND_BASE_URL: ${BACKEND_BASE_URL:-http://host.docker.internal:8080}
      KG_MODE: ${KG_MODE:-off}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-hercfit-graph-dev}
      REDIS_URL: redis://:${REDIS_PASSWORD:-hercfit-redis-dev}@redis:6379/0
      SESSION_MEMORY_MODE: ${SESSION_MEMORY_MODE:-off}
    ports: ["${AGENT_PORT:-8081}:8081"]
    depends_on:
      migrate:
        condition: service_completed_successfully
  redis:
    image: redis:8.2-alpine
    profiles: [memory]
    command: [redis-server, --appendonly, "yes", --appendfsync, everysec, --maxmemory, "${REDIS_MAXMEMORY:-256mb}",
              --maxmemory-policy, volatile-lru, --requirepass, "${REDIS_PASSWORD:-hercfit-redis-dev}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-hercfit-redis-dev}
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    volumes: [agentic_redis_data:/data]
    healthcheck:
      test: [CMD-SHELL, 'redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10
  neo4j:
    image: neo4j:2026.10.0
    profiles: [kg]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-hercfit-graph-dev}
      KG_HEALTH_PASSWORD: ${NEO4J_PASSWORD:-hercfit-graph-dev}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    volumes: [agentic_neo4j_data:/data]
    healthcheck:
      test: [CMD-SHELL, 'cypher-shell -u neo4j -p "$$KG_HEALTH_PASSWORD" "RETURN 1" >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
  kg-worker:
    profiles: [kg]
    build:
      context: ..
      dockerfile: agentic/Dockerfile
    env_file:
      - path: ../.env
        required: false
      - path: .env
        required: false
    environment:
      AGENT_DATABASE_URL: postgresql://hercfit:${AGENT_DB_PASSWORD:-hercfit_secret}@postgres:5432/hercfit_agentic
      KG_BACKEND_DATABASE_URL: ${KG_BACKEND_DATABASE_URL:-postgresql://hercfit:hercfit_secret@host.docker.internal:5432/hercfit_db}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-hercfit-graph-dev}
    command: [python, -m, knowledge_graph.worker, run]
    depends_on:
      neo4j:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
volumes:
  agentic_pg_data:
  agentic_neo4j_data:
  agentic_redis_data:
