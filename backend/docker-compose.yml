name: hercfit-backend

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hercfit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hercfit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hercfit_secret}
      POSTGRES_DB: ${POSTGRES_DB:-hercfit_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hercfit} -d ${POSTGRES_DB:-hercfit_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hercfit-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    container_name: hercfit-backend-api
    restart: unless-stopped
    # Development: migrate on start and hot-reload the mounted source.
    command: ["sh", "-c", "alembic upgrade head && python run_service.py"]
    env_file:
      - path: .env
        required: false
    environment:
      MODE: ${MODE:-dev}
      HOST: 0.0.0.0
      PORT: ${PORT:-8080}
      DATABASE_TYPE: postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-hercfit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hercfit_secret}
      POSTGRES_DB: ${POSTGRES_DB:-hercfit_db}
      POSTGRES_APPLICATION_NAME: ${POSTGRES_APPLICATION_NAME:-hercfit-backend}
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - hercfit-network

  agentic:
    build:
      context: .
      dockerfile: Dockerfile
      target: agentic
    container_name: hercfit-agentic-api
    restart: unless-stopped
    command: ["python", "-m", "uvicorn", "agentic.core.app.main:app", "--host", "0.0.0.0", "--port", "8081", "--reload"]
    env_file:
      - path: .env
        required: false
      - path: agentic/.env
        required: false
    environment:
      MODE: ${MODE:-dev}
      AGENT_PORT: ${AGENT_PORT:-8081}
      BACKEND_BASE_URL: http://backend:8080
      AGENT_DATABASE_URL: postgresql://${POSTGRES_USER:-hercfit}:${POSTGRES_PASSWORD:-hercfit_secret}@postgres:5432/${POSTGRES_DB:-hercfit_db}
      KG_MODE: ${KG_MODE:-off}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-hercfit-graph-dev}
      # Optional: start Redis with --profile memory, then set SESSION_MEMORY_MODE.
      REDIS_URL: redis://:${REDIS_PASSWORD:-hercfit-redis-dev}@redis:6379/0
      SESSION_MEMORY_MODE: ${SESSION_MEMORY_MODE:-off}
    ports:
      - "${AGENT_PORT:-8081}:8081"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - hercfit-network

  neo4j:
    image: neo4j:2026.10.0
    profiles: [kg]
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-hercfit-graph-dev}
      KG_HEALTH_PASSWORD: ${NEO4J_PASSWORD:-hercfit-graph-dev}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    volumes: [neo4j_data:/data]
    healthcheck:
      test: [CMD-SHELL, 'cypher-shell -u neo4j -p "$$KG_HEALTH_PASSWORD" "RETURN 1" >/dev/null 2>&1']
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks: [hercfit-network]

  redis:
    image: redis:8.2-alpine
    profiles: [memory]
    restart: unless-stopped
    # Session memory is rebuildable from checkpoints: every key has a TTL, so
    # volatile-lru eviction only costs memory, never correctness.
    command: [redis-server, --appendonly, "yes", --appendfsync, everysec, --maxmemory, "${REDIS_MAXMEMORY:-256mb}",
              --maxmemory-policy, volatile-lru, --requirepass, "${REDIS_PASSWORD:-hercfit-redis-dev}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-hercfit-redis-dev}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD-SHELL, 'redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [hercfit-network]

  kg-worker:
    profiles: [kg]
    build:
      context: .
      dockerfile: Dockerfile
      target: agentic
    restart: unless-stopped
    command: [python, -m, knowledge_graph.worker, run]
    env_file:
      - path: .env
        required: false
      - path: agentic/.env
        required: false
    environment:
      AGENT_DATABASE_URL: postgresql://${POSTGRES_USER:-hercfit}:${POSTGRES_PASSWORD:-hercfit_secret}@postgres:5432/${POSTGRES_DB:-hercfit_db}
      KG_BACKEND_DATABASE_URL: postgresql://${POSTGRES_USER:-hercfit}:${POSTGRES_PASSWORD:-hercfit_secret}@postgres:5432/${POSTGRES_DB:-hercfit_db}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-hercfit-graph-dev}
    depends_on:
      neo4j:
        condition: service_healthy
      agentic:
        condition: service_healthy
    networks: [hercfit-network]
    healthcheck:
      disable: true

  embedding-worker:
    profiles: [rag]
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    restart: unless-stopped
    command: [python, -m, embedding.worker]
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-hercfit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hercfit_secret}
      POSTGRES_DB: ${POSTGRES_DB:-hercfit_db}
      KNOWLEDGE_INGEST_ROOT: /knowledge-input
    volumes:
      - ./knowledge-input:/knowledge-input:ro
    depends_on:
      backend:
        condition: service_healthy
    networks: [hercfit-network]
    healthcheck:
      disable: true

volumes:
  neo4j_data:
  redis_data:
  postgres_data:
    name: hercfit_postgres_data

networks:
  hercfit-network:
    name: hercfit-network
    driver: bridge
